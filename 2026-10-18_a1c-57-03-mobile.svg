<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1400" viewBox="0 0 600 1400" role="img" aria-labelledby="title desc"><title id="title">검사 결과를 다음 선택으로 잇는 네 단계</title><desc id="desc">결과표 비교, 단 음료 대신 물 선택, 가능한 만큼 걷기, 기록을 다음 검사나 상담에서 확인하는 흐름이다. 개선이나 치료 효과를 보장하지 않는다.</desc><rect width="600" height="1400" fill="#f7fbfc"/><text x="38" y="76" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="32" font-weight="700" fill="#176b91">확인한 결과를 다음 행동으로</text><text x="38" y="132" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="37" font-weight="800" fill="#243746">비교하고, 고르고, 다시 확인</text>
<path d="M40 225v865" fill="none" stroke="#8bc7bc" stroke-width="8" stroke-dasharray="3 18" stroke-linecap="round"/>
<g font-family="Malgun Gothic,Noto Sans KR,sans-serif"><rect x="64" y="180" width="500" height="250" rx="24" fill="#fff" stroke="#d4e4e9" stroke-width="2"/><circle cx="40" cy="225" r="20" fill="#176b91"/><g transform="translate(92 228)" fill="none" stroke="#176b91" stroke-width="6"><rect x="0" y="0" width="70" height="100" rx="8"/><rect x="38" y="24" width="70" height="100" rx="8" fill="#f7fbfc"/><path d="M53 53h42M53 75h42M53 97h30" stroke="#8aaebb" stroke-width="5" stroke-linecap="round"/></g><text x="232" y="270" font-size="32" font-weight="800" fill="#243746">검사표 비교</text><text x="232" y="320" font-size="25" fill="#456172"><tspan x="232">최근 결과와 이전 결과를</tspan><tspan x="232" dy="36">함께 살펴봐</tspan></text>
<rect x="64" y="470" width="500" height="250" rx="24" fill="#fff" stroke="#d4e4e9" stroke-width="2"/><circle cx="40" cy="515" r="20" fill="#176b91"/><g transform="translate(94 530)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0h55l-6 74H8z" stroke="#c98259" stroke-width="6"/><path d="M12 17h30" stroke="#c98259" stroke-width="6"/><path d="M73 37h26" stroke="#4c9e94" stroke-width="6"/><path d="M89 28l12 9-12 9" stroke="#4c9e94" stroke-width="6"/><path d="M116 0h55l-6 74h-43z" stroke="#176b91" stroke-width="6"/><path d="M122 40h44" stroke="#8bc7bc" stroke-width="16"/></g><text x="286" y="560" font-size="32" font-weight="800" fill="#243746">음료 고르기</text><text x="286" y="610" font-size="25" fill="#456172"><tspan x="286">단 음료 대신 물을</tspan><tspan x="286" dy="36">고를 수 있어</tspan></text>
<rect x="64" y="760" width="500" height="250" rx="24" fill="#fff" stroke="#d4e4e9" stroke-width="2"/><circle cx="40" cy="805" r="20" fill="#176b91"/><g transform="translate(92 842)" fill="#e3f1f4" stroke="#176b91" stroke-width="6" stroke-linejoin="round"><path d="M4 74c13-12 18-35 20-62 1-13 13-20 24-12l27 26c10 9 19 12 35 16l36 8c12 3 18 11 18 22v10H4z"/><path d="M22 79h34M43 62h29M64 47h24" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="6"/></g><text x="286" y="850" font-size="32" font-weight="800" fill="#243746">걷기</text><text x="286" y="900" font-size="25" fill="#456172"><tspan x="286">가능한 시간과 속도로</tspan><tspan x="286" dy="36">걸어 봐</tspan></text>
<rect x="64" y="1050" width="500" height="250" rx="24" fill="#fff" stroke="#d4e4e9" stroke-width="2"/><circle cx="40" cy="1095" r="20" fill="#176b91"/><g transform="translate(96 1105)" stroke="#176b91" stroke-width="6" stroke-linejoin="round" fill="#f7fbfc"><rect x="0" y="0" width="120" height="130" rx="12"/><path d="M0 35h120M28 -12v28M90 -12v28" fill="none" stroke-linecap="round"/><path d="M20 62h12M46 62h12M72 62h12M20 86h12M46 86h12M72 86h12" stroke="#8aaebb" stroke-width="8" stroke-linecap="round"/><path d="M52 108l14 14 28-34" fill="none" stroke="#4c9e94" stroke-width="8" stroke-linecap="round"/></g><text x="250" y="1140" font-size="32" font-weight="800" fill="#243746">추적 확인</text><text x="250" y="1190" font-size="25" fill="#456172"><tspan x="250">기록을 다음 검사나</tspan><tspan x="250" dy="36">상담에서 함께 봐</tspan></text></g>
<text x="38" y="1360" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="22" fill="#456172">개인 건강에 맞는 검사·치료 계획은 의료진과 상의해.</text></svg>