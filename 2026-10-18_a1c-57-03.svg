<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">당화혈색소 결과를 다음 선택으로 잇는 네 단계</title><desc id="desc">최근 결과와 이전 결과를 비교하고, 단 음료 대신 물을 선택하고, 가능한 만큼 걷고, 기록을 다음 검사나 상담에서 확인하는 흐름을 보여준다. 치료 효과나 결과 개선을 약속하지 않는다.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbfc"/><stop offset="1" stop-color="#f2f8f5"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#23465a" flood-opacity=".09"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#4c9e94"/></marker></defs>
<rect width="1600" height="1200" fill="url(#bg)"/><path d="M0 240 Q360 70 750 210 T1600 170" fill="none" stroke="#d8eee8" stroke-width="90" opacity=".55"/>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" fill="#243746"><text x="100" y="112" font-size="34" font-weight="700" letter-spacing="2" fill="#176b91">확인한 결과를 다음 행동으로</text><text x="100" y="212" font-size="74" font-weight="800">비교하고, 고르고, 다시 확인하기</text><text x="100" y="280" font-size="36" fill="#456172">한 번의 결과만으로 결론내리기보다 차근히 살펴보는 흐름이야.</text></g>
<!-- Visual pathway behind the four cards -->
<path d="M390 565 C420 525 435 525 463 565 M775 565 C805 525 820 525 848 565 M1160 565 C1190 525 1205 525 1233 565" fill="none" stroke="#4c9e94" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 19" marker-end="url(#arrow)"/>
<g filter="url(#s)"><rect x="60" y="355" width="330" height="650" rx="30" fill="#fff"/><rect x="445" y="355" width="330" height="650" rx="30" fill="#fff"/><rect x="830" y="355" width="330" height="650" rx="30" fill="#fff"/><rect x="1215" y="355" width="330" height="650" rx="30" fill="#fff"/></g>
<!-- Step 1: compare records -->
<g stroke="#176b91" stroke-width="10" stroke-linejoin="round" fill="none"><rect x="143" y="455" width="126" height="158" rx="13"/><rect x="194" y="490" width="126" height="158" rx="13" fill="#f5fafb"/><path d="M218 532h78M218 562h78M218 592h55" stroke="#8aaebb" stroke-width="8" stroke-linecap="round"/><path d="M166 500h48M166 530h18M166 560h18" stroke="#8aaebb" stroke-width="8" stroke-linecap="round"/></g>
<!-- Step 2: choose water instead of a sweet drink -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M499 490h85l-10 120h-65z" stroke="#d28a62" stroke-width="9"/><path d="M520 464l48 0M555 464l-8 28" stroke="#d28a62" stroke-width="8"/><path d="M622 492h82l-10 118h-62z" stroke="#176b91" stroke-width="9"/><path d="M632 533h62" stroke="#7fc5ce" stroke-width="23"/><path d="M585 548h24" stroke="#4c9e94" stroke-width="8" marker-end="url(#arrow)"/></g><circle cx="542" cy="470" r="8" fill="#d28a62"/><circle cx="558" cy="450" r="8" fill="#d28a62"/><circle cx="575" cy="470" r="8" fill="#d28a62"/>
<!-- Step 3: walking shoes and a dotted walking path -->
<g fill="#e3f1f4" stroke="#176b91" stroke-width="9" stroke-linejoin="round"><path d="M883 571c17-14 25-45 29-82 2-18 18-27 32-16l36 34c12 11 25 17 45 21l60 13c16 4 27 17 27 32v19H883z"/><path d="M890 607c16-13 20-36 23-61 2-16 16-23 29-13l28 22c14 11 27 17 47 22l43 11c14 4 23 15 23 28v10H890z" opacity=".85"/></g><path d="M930 554h41M952 570h40M977 587h38" stroke="#fff" stroke-width="8" stroke-linecap="round"/><circle cx="887" cy="485" r="7" fill="#4c9e94"/><circle cx="871" cy="463" r="7" fill="#4c9e94"/><circle cx="856" cy="441" r="7" fill="#4c9e94"/>
<!-- Step 4: keep a record and check it at a future appointment -->
<g stroke="#176b91" stroke-width="9" stroke-linejoin="round"><rect x="1290" y="452" width="180" height="190" rx="18" fill="#f7fbfc"/><path d="M1290 500h180" fill="none"/><path d="M1332 433v38M1428 433v38" fill="none" stroke-linecap="round"/><path d="M1320 535h30M1370 535h30M1420 535h28M1320 570h30M1370 570h30M1420 570h28" fill="none" stroke="#9bb8c3" stroke-width="10" stroke-linecap="round"/><path d="M1355 610l20 20 40-45" fill="none" stroke="#4c9e94" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></g>
<!-- Labels -->
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" text-anchor="middle" fill="#243746">
<text x="225" y="725" font-size="50" font-weight="800">검사표 비교</text><text x="225" y="792" font-size="32"><tspan x="225">최근 결과와 이전 결과를</tspan><tspan x="225" dy="44">함께 살펴봐</tspan></text>
<text x="610" y="725" font-size="50" font-weight="800">음료 고르기</text><text x="610" y="792" font-size="32"><tspan x="610">단 음료 대신 물을</tspan><tspan x="610" dy="44">고를 수 있어</tspan></text>
<text x="995" y="725" font-size="50" font-weight="800">걷기</text><text x="995" y="792" font-size="32"><tspan x="995">가능한 시간과 속도로</tspan><tspan x="995" dy="44">걸어 봐</tspan></text>
<text x="1380" y="725" font-size="50" font-weight="800">추적 확인</text><text x="1380" y="792" font-size="32"><tspan x="1380">기록을 다음 검사나</tspan><tspan x="1380" dy="44">상담에서 함께 봐</tspan></text>
</g>
<rect x="60" y="1075" width="1485" height="74" rx="24" fill="#e0eeeb"/><text x="100" y="1124" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="29" fill="#365566">생활 선택은 개인마다 달라. 검사·치료 결정은 의료진과 상의해.</text>
</svg>