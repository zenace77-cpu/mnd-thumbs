<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">당화혈색소 기준 구간과 5.7% 경계</title><desc id="desc">정상 범위는 5.7% 미만, 당뇨병 전단계 범위는 5.7%에서 6.4%, 당뇨병 기준 범위는 6.5% 이상. 5.7% 표식은 정상과 전단계 범위 사이에 놓여 있다.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7fbfd"/><stop offset="1" stop-color="#eaf4f7"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#23465a" flood-opacity=".10"/></filter></defs>
<rect width="1600" height="1200" rx="0" fill="url(#bg)"/><circle cx="1450" cy="140" r="170" fill="#d9efea" opacity=".7"/><circle cx="115" cy="1030" r="175" fill="#d9edf5" opacity=".75"/>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" fill="#243746">
<text x="120" y="116" font-size="34" font-weight="700" letter-spacing="2" fill="#176b91">검사 결과를 읽는 기준</text>
<text x="120" y="220" font-size="78" font-weight="800">5.7%는 경계의 시작점</text>
<text x="120" y="285" font-size="38" fill="#456172">당화혈색소 기준 범위에서 내 결과가 어디에 놓이는지 확인해.</text>
</g>
<g filter="url(#shadow)"><rect x="112" y="372" width="1376" height="486" rx="34" fill="#ffffff"/></g>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif">
<text x="160" y="438" font-size="31" font-weight="700" fill="#456172">기준 구간</text>
<!-- Three distinct categories; equal widths are categorical, not a linear numeric scale. -->
<rect x="160" y="492" width="426" height="72" rx="22" fill="#cfe6f1"/><rect x="586" y="492" width="428" height="72" fill="#72bcae"/><rect x="1014" y="492" width="426" height="72" rx="22" fill="#315f83"/>
<line x1="586" y1="478" x2="586" y2="594" stroke="#123f62" stroke-width="6"/><path d="M570 478 L586 458 L602 478 Z" fill="#123f62"/><rect x="480" y="384" width="212" height="74" rx="37" fill="#123f62"/><text x="586" y="435" text-anchor="middle" font-size="47" font-weight="800" fill="#fff">5.7%</text>
<g fill="#243746" text-anchor="middle">
<text x="373" y="656" font-size="39" font-weight="700">정상 범위</text><text x="373" y="718" font-size="48" font-weight="800">5.7% 미만</text>
<text x="800" y="656" font-size="37" font-weight="700">당뇨병 전단계</text><text x="800" y="718" font-size="48" font-weight="800">5.7%–6.4%</text>
<text x="1227" y="656" font-size="37" font-weight="700">당뇨병 기준 범위</text><text x="1227" y="718" font-size="48" font-weight="800">≥6.5%</text>
</g>
<rect x="160" y="774" width="1280" height="1" fill="#dbe7eb"/><text x="160" y="824" font-size="29" fill="#516b79">구간 칸의 너비는 실제 수치 비율을 나타내지 않아.</text>
</g>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><rect x="112" y="900" width="1376" height="190" rx="30" fill="#e1f0ed"/><circle cx="190" cy="995" r="34" fill="#176b91"/><path d="M174 995l12 12 23-27" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="974" font-size="35" font-weight="700" fill="#243746">검사 기준은 진단을 확인하는 출발점이야.</text><text x="250" y="1035" font-size="31" fill="#456172">증상이 없을 때는 결과 확인을 위해 다른 날 재검이나 다른 검사가 필요할 수 있어.</text></g>
</svg>