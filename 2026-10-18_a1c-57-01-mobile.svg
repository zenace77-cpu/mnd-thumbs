<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1200" viewBox="0 0 600 1200" role="img" aria-labelledby="title desc"><title id="title">당화혈색소 5.7% 기준 구간</title><desc id="desc">정상 범위는 5.7% 미만, 당뇨병 전단계 범위는 5.7%에서 6.4%, 당뇨병 기준 범위는 6.5% 이상이다. 5.7%는 전단계 범위의 시작점이다.</desc><rect width="600" height="1200" fill="#f5fafc"/><text x="42" y="76" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="34" font-weight="700" fill="#176b91">검사 결과를 읽는 기준</text><text x="42" y="142" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="50" font-weight="800" fill="#243746">5.7%는 경계의 시작</text><text x="42" y="198" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="28" fill="#456172">당화혈색소 기준 범위를 확인해.</text><rect x="42" y="240" width="516" height="94" rx="26" fill="#123f62"/><text x="300" y="301" text-anchor="middle" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="48" font-weight="800" fill="#fff">5.7%부터 전단계 범위</text>
<g font-family="Malgun Gothic,Noto Sans KR,sans-serif"><rect x="42" y="370" width="516" height="190" rx="24" fill="#d9edf5"/><rect x="42" y="370" width="16" height="190" rx="8" fill="#4c9e94"/><text x="82" y="438" font-size="36" font-weight="700" fill="#243746">정상 범위</text><text x="82" y="512" font-size="50" font-weight="800" fill="#123f62">5.7% 미만</text>
<rect x="42" y="585" width="516" height="190" rx="24" fill="#dcefe9"/><rect x="42" y="585" width="16" height="190" rx="8" fill="#176b91"/><text x="82" y="653" font-size="36" font-weight="700" fill="#243746">당뇨병 전단계 범위</text><text x="82" y="727" font-size="50" font-weight="800" fill="#123f62">5.7%–6.4%</text>
<rect x="42" y="800" width="516" height="190" rx="24" fill="#e4ebf1"/><rect x="42" y="800" width="16" height="190" rx="8" fill="#315f83"/><text x="82" y="868" font-size="36" font-weight="700" fill="#243746">당뇨병 기준 범위</text><text x="82" y="942" font-size="50" font-weight="800" fill="#123f62">≥6.5%</text></g>
<rect x="42" y="1030" width="516" height="130" rx="22" fill="#e1f0ed"/><text x="68" y="1082" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="27" font-weight="700" fill="#243746">증상이 없을 때는 결과 확인을 위해</text><text x="68" y="1126" font-family="Malgun Gothic,Noto Sans KR,sans-serif" font-size="27" fill="#456172">재검이나 다른 검사가 필요할 수 있어.</text></svg>